spring:
  application:
    name: backend
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: fraud_dev
    password: fraud_dev
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000